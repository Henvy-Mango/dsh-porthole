name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
        exclude:
          # macOS 只跑一个 Node 版本：本项目的平台差异集中在路径处理（例如
          # /private/var/folders 的 realpath 解析），与 Node 版本无关；
          # 而 macOS runner 更容易排队超时（连续多次出现 steps=0、runner 未分配的
          # cancelled）。保留 macOS 覆盖、降低排队压力。
          - os: macos-latest
            node: 22
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Build client bundle
        run: npm run build:client

      - name: Verify bundle is up to date
        shell: bash
        run: git diff --exit-code client/client.js

      - name: Test
        run: npm test
